services:
  # 1. Backend Spring Boot Web Service
  - type: web
    name: cellex-backend
    runtime: docker
    plan: free
    region: singapore
    dockerContext: .
    dockerfilePath: Dockerfile.backend
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      - key: APPLICATION_SECURITY_JWT_SECRET_KEY
        sync: false
      - key: APPLICATION_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION
        value: "86400000" # 24 hours in ms
      - key: APPLICATION_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION
        value: "604800000" # 7 days in ms
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false
      - key: FIREBASE_CONFIG_PATH
        value: firebase-service-account.json
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_BASE_URL
        value: http://cellex-ml-service:8000
    healthCheckPath: /actuator/health
    autoDeploy: true

  # 2. ML Service FastAPI
  - type: web
    name: cellex-ml-service
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ml-service
    dockerfilePath: ml-service/Dockerfile.ml
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: cellex
      - key: POSTGRES_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: RETRAIN_ON_STARTUP
        value: "false"
      - key: MODEL_DIR
        value: ./trained_models
      - key: VECTOR_STORE_PATH
        value: ./vector_store
    healthCheckPath: /health
    autoDeploy: true
