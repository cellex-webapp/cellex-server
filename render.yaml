services:
  # 1. Backend Spring Boot Web Service
  - type: web
    name: cellex-backend
    runtime: docker
    plan: free
    region: singapore
    rootDirectory: .
    envVars:
      - key: SERVER_PORT
        value: 8080
      - key: MONGO_URI
        sync: false
      - key: EMAIL_USERNAME
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false
      - key: FIREBASE_CONFIG_PATH
        value: firebase-service-account.json
      - key: OPENAI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: cellex-ml-service
          property: host
    healthCheckPath: /actuator/health
    autoDeploy: true
    # Note: Disk removed for Free Tier compatibility

  # 2. ML Service FastAPI
  - type: web
    name: cellex-ml-service
    runtime: docker
    plan: free
    region: singapore
    # Docker context and file path for the ml-service subdirectory
    dockerContext: ml-service
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: cellex
      - key: POSTGRES_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: RETRAIN_ON_STARTUP
        value: "true"
      # Using internal ephemeral storage for models/vector store on Free Tier
      - key: MODEL_DIR
        value: ./trained_models
      - key: VECTOR_STORE_PATH
        value: ./vector_store
    healthCheckPath: /health
    autoDeploy: true
    # Note: Disk removed for Free Tier compatibility
