spring.application.name=cellex


# Read the server port from the environment, defaulting to 8080
server.port=${SERVER_PORT:8080}

# Read the MongoDB connection string from the environment
spring.data.mongodb.uri=${MONGO_URI}

# Automatically create indexes defined in the @Document models
spring.data.mongodb.auto-index-creation=true

# AWS Configuration
aws.region=ap-southeast-1
aws.s3.bucketName=cellex-bucket

# Email Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

