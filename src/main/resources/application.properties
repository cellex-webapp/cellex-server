spring.application.name=cellex

# Load local .env file when present (development), ignore when missing (production)
spring.config.import=optional:file:.env[.properties]


# Read the server port from the environment
# Render uses PORT variable, fallback to SERVER_PORT or 8080
server.port=${PORT:${SERVER_PORT:8080}}

# ==================== MongoDB Configuration ====================
# Read the MongoDB connection string from the environment
spring.data.mongodb.uri=${MONGO_URI}

# Automatically create indexes defined in the @Document models
spring.data.mongodb.auto-index-creation=true

# ==================== PostgreSQL (Supabase) Configuration ====================
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/cellex}
spring.datasource.username=${SUPABASE_DB_USERNAME:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
# Fix for Supabase Transaction Pooler (prepared statement "S_1" already exists)
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:3}

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# AWS Configuration
aws.region=ap-southeast-1
aws.s3.bucketName=cellex-bucket

# Google OAuth2 Properties
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}
google.refresh.token=${GOOGLE_REFRESH_TOKEN}

CLOUDINARY_URL=${CLOUDINARY_URL}

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# VNPAY Configuration
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.url=${VNPAY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.version=${VNPAY_VERSION:2.1.0}
vnpay.command=${VNPAY_COMMAND:pay}
vnpay.currency=${VNPAY_CURRENCY:VND}
vnpay.locale=${VNPAY_LOCALE:vn}
vnpay.order-type=${VNPAY_ORDER_TYPE:other}

# Frontend URLs for payment redirect
frontend.payment.success-url=${FRONTEND_PAYMENT_SUCCESS_URL:http://localhost:3000/payment/success}
frontend.payment.failure-url=${FRONTEND_PAYMENT_FAILURE_URL:http://localhost:3000/payment/failure}

# Firebase Configuration for Push Notifications
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-service-account.json}

# OpenAI Configuration for Review Moderation
openai.api.key=${OPENAI_API_KEY:}
openai.moderation.enabled=${OPENAI_MODERATION_ENABLED:true}

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}

# ML Service Configuration (FastAPI Recommendation Microservice)
ml-service.base-url=${ML_SERVICE_BASE_URL:http://localhost:8000}
ml-service.timeout-seconds=${ML_SERVICE_TIMEOUT_SECONDS:30}
ml-service.enabled=${ML_SERVICE_ENABLED:true}

# Unsplash API Configuration
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
unsplash.secret-key=${UNSPLASH_SECRET_KEY:}
unsplash.per-page=5

# RestTemplate timeout (milliseconds)
unsplash.timeout-ms=5000

#action url
# app.action.url=${APP_NOTIFICATION_CHAT_ACTION_URL:http://localhost:5173/account?tab=messages#messages}

zego.app.id=${ZEGO_APP_ID:}
zego.server.secret=${ZEGO_SERVER_SECRET:}