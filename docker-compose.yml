version: '3.8'

services:
  # Spring Boot Application
  cellex-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cellex-backend
    ports:
      - "8080:8080"
    environment:
      # Server Configuration
      PORT: 8080
      
      # Database - use local MongoDB or MongoDB Atlas
      MONGO_URI: mongodb://mongodb:27017/cellex
      # MONGO_URI: mongodb+srv://user:pass@cluster.mongodb.net/cellex?retryWrites=true&w=majority
      
      # Email Configuration
      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      
      # Google OAuth2
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN}
      
      # Cloudinary
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      
      # VNPay
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET}
      VNPAY_URL: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      VNPAY_RETURN_URL: http://localhost:8080/api/payment/vnpay-return
      VNPAY_VERSION: 2.1.0
      VNPAY_COMMAND: pay
      VNPAY_CURRENCY: VND
      VNPAY_LOCALE: vn
      VNPAY_ORDER_TYPE: other
      
      # Frontend URLs
      FRONTEND_PAYMENT_SUCCESS_URL: http://localhost:3000/payment/success
      FRONTEND_PAYMENT_FAILURE_URL: http://localhost:3000/payment/failure
      
      # Firebase
      FIREBASE_CONFIG_PATH: firebase-service-account.json
      
      # OpenAI (Optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODERATION_ENABLED: false
    
    volumes:
      # Mount firebase config if exists
      - ./src/main/resources/firebase-service-account.json:/app/firebase-service-account.json:ro
    
    depends_on:
      - mongodb
    
    networks:
      - cellex-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MongoDB (Local development)
  mongodb:
    image: mongo:7.0
    container_name: cellex-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: cellex
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - cellex-network
    restart: unless-stopped

  # Mongo Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: cellex-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - cellex-network
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local

networks:
  cellex-network:
    driver: bridge
